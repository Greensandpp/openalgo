name: GreenSoil Lab Safety Gate
on:
  push:
    branches:
      - greens-oil/paper-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile modified backend files
        run: |
          python -m compileall -q greensoil_lab app.py services test/test_greensoil_lab_read_only.py
      - name: Check broker order guard placement (no external deps)
        run: python -m unittest discover -s test -p 'test_greensoil_lab_static.py' -v
      - name: Install minimal isolated test dependency
        run: python -m pip install 'Flask>=3,<4'
      - name: Run lab denial unit tests
        run: python -m unittest discover -s test -p 'test_greensoil_lab_read_only.py' -v
      - name: Check offline 8:30 report drawing contract
        run: python -m unittest discover -s test -p 'test_greensoil_lab_report_drawings.py' -v
      - name: Validate local daily baseline handoff
        run: python -m unittest discover -s test -p 'test_greensoil_lab_baseline_source.py' -v
      - name: Validate early warning fails closed on stale OI data
        run: python -m unittest discover -s test -p 'test_greensoil_lab_monitor_events.py' -v
      - name: Verify no broker credentials in CI
        run: |
          test -z "${BROKER_API_KEY:-}"
          test -z "${BROKER_AUTH_TOKEN:-}"
